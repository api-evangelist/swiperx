name: SwipeRx
description: >-
  SwipeRx (operated by mClinica Pte. Ltd., formerly mClinica Pharmacy Solutions)
  is the leading community and B2B commerce platform for pharmacies across
  Southeast Asia. Delivered as a mobile application, it connects a network of
  more than 300,000 pharmacy professionals and 50,000 retail pharmacies in
  Indonesia, the Philippines, Vietnam, Thailand and Cambodia. The platform
  combines professional networking, accredited continuing professional
  development (CPD) education, industry news, a drug directory, adverse-event
  reporting, and B2B medicine purchasing (the Belanja marketplace) into a single
  app that digitizes a historically fragmented pharmacy supply chain. SwipeRx
  publishes no public developer API, OpenAPI specification, SDK, or developer
  portal; its api.swiperxapp.com host is an undocumented private backend serving
  the mobile app.
